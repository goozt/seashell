# SeaShell Docker Compose — single-node (primary) deployment
#
# For a multi-node deployment:
#   - Copy this file to each authority server
#   - Set IS_PRIMARY=false and PRIMARY_NODE_URL on secondary nodes
#   - Share NODE_SECRET across all nodes out-of-band
#   - Mount separate volumes for each node's ./db directory
#
# Quick start:
#   cp .env.example .env  # fill in secrets
#   docker compose up -d

version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seashell-api
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DB_PATH: "/app/db"

      # JWT / Auth
      JWT_SECRET: "${JWT_SECRET}"
      SUPERADMIN_PASSWORD: "${SUPERADMIN_PASSWORD}"
      SUPERADMIN_EMAIL: "${SUPERADMIN_EMAIL:-superadmin@seashell.local}"
      ACCESS_TOKEN_MINUTES: "${ACCESS_TOKEN_MINUTES:-15}"
      REFRESH_TOKEN_DAYS: "${REFRESH_TOKEN_DAYS:-7}"

      # Node / P2P
      NODE_URL: "${NODE_URL}"
      PRIMARY_NODE_URL: "${PRIMARY_NODE_URL:-}"
      IS_PRIMARY: "${IS_PRIMARY:-false}"
      NODE_SECRET: "${NODE_SECRET}"
    volumes:
      - seashell-db:/app/db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ui:
    build:
      context: ./example
      dockerfile: Dockerfile
    container_name: seashell-ui
    restart: unless-stopped
    ports:
      - "${UI_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: "${API_URL:-http://localhost:8080}"
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - ui

volumes:
  seashell-db:
    driver: local
