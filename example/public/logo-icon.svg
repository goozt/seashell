<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background radial -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8e4f7"/>
      <stop offset="100%" stop-color="#d4d0f0"/>
    </radialGradient>
    <!-- Facet gradients -->
    <linearGradient id="facet-ll" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="facet-lm" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="facet-cl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="facet-cr" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="facet-rm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="facet-rr" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.7"/>
    </linearGradient>
    <!-- Bottom facets -->
    <linearGradient id="facet-bl" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#e0d7ff" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="facet-bc" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#d1fae5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f0fdf4" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="facet-br" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fff7ed" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

  <!-- ===== SHELL BODY ===== -->
  <!-- The shell outline: pentagon top with notched base -->
  <!-- Outer clip shape -->
  <clipPath id="shell-clip">
    <path d="
      M 100 22
      L 142 42
      L 160 78
      L 160 108
      L 148 108
      L 148 122
      L 135 135
      L 118 124
      L 110 135
      L 100 142
      L 90 135
      L 82 124
      L 65 135
      L 52 122
      L 52 108
      L 40 108
      L 40 78
      L 58 42
      Z
    "/>
  </clipPath>

  <!-- Far-left facet: center → top-far-left → left-edge -->
  <polygon points="100,90 58,42 40,78 40,108 52,108" fill="url(#facet-ll)" clip-path="url(#shell-clip)"/>

  <!-- Left-mid facet: center → top-left → top-far-left -->
  <polygon points="100,90 75,28 58,42" fill="url(#facet-lm)" clip-path="url(#shell-clip)"/>

  <!-- Center-left facet: center → top → top-left -->
  <polygon points="100,90 100,22 75,28" fill="url(#facet-cl)" clip-path="url(#shell-clip)"/>

  <!-- Center-right facet: center → top-right → top -->
  <polygon points="100,90 125,28 100,22" fill="url(#facet-cr)" clip-path="url(#shell-clip)"/>

  <!-- Right-mid facet: center → top-far-right → top-right -->
  <polygon points="100,90 142,42 125,28" fill="url(#facet-rm)" clip-path="url(#shell-clip)"/>

  <!-- Far-right facet: center → right-edge → top-far-right -->
  <polygon points="100,90 160,78 160,108 148,108 142,42" fill="url(#facet-rr)" clip-path="url(#shell-clip)"/>

  <!-- Bottom-left base facet -->
  <polygon points="100,90 52,108 52,122 65,135 82,124 90,135 100,142 100,108" fill="url(#facet-bl)" clip-path="url(#shell-clip)"/>

  <!-- Bottom-center base facet -->
  <polygon points="100,90 100,108 100,142" fill="url(#facet-bc)" clip-path="url(#shell-clip)"/>

  <!-- Bottom-right base facet -->
  <polygon points="100,90 148,108 148,122 135,135 118,124 110,135 100,142 100,108" fill="url(#facet-br)" clip-path="url(#shell-clip)"/>

  <!-- ===== OUTLINE STROKES ===== -->
  <g stroke="#3d4460" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- Outer shell shape -->
    <path d="
      M 100 22
      L 142 42
      L 160 78
      L 160 108
      L 148 108
      L 148 122
      L 135 135
      L 118 124
      L 110 135
      L 100 142
      L 90 135
      L 82 124
      L 65 135
      L 52 122
      L 52 108
      L 40 108
      L 40 78
      L 58 42
      Z
    "/>
    <!-- Internal facet lines from center (100,90) -->
    <line x1="100" y1="90" x2="100" y2="22"/>
    <line x1="100" y1="90" x2="75" y2="28"/>
    <line x1="100" y1="90" x2="58" y2="42"/>
    <line x1="100" y1="90" x2="125" y2="28"/>
    <line x1="100" y1="90" x2="142" y2="42"/>
    <!-- Horizontal separator -->
    <line x1="40" y1="108" x2="52" y2="108"/>
    <line x1="148" y1="108" x2="160" y2="108"/>
    <line x1="100" y1="90" x2="52" y2="108"/>
    <line x1="100" y1="90" x2="148" y2="108"/>
    <line x1="100" y1="90" x2="100" y2="142"/>
    <!-- Bottom diamond hint -->
    <line x1="100" y1="108" x2="82" y2="124"/>
    <line x1="100" y1="108" x2="118" y2="124"/>
  </g>
</svg>
