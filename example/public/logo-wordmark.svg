    <g stroke="#3d4460" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none">
      <path d="M 0 -68 L 42 -48 L 60 -12 L 60 18 L 48 18 L 48 32 L 35 45 L 18 34 L 10 45 L 0 52 L -10 45 L -18 34 L -35 45 L -48 32 L -48 18 L -60 18 L -60 -12 L -42 -48 Z"/>
      <line x1="0" y1="0" x2="0" y2="-68"/>
      <line x1="0" y1="0" x2="-25" y2="-62"/>
      <line x1="0" y1="0" x2="-42" y2="-48"/>
      <line x1="0" y1="0" x2="25" y2="-62"/>
      <line x1="0" y1="0" x2="42" y2="-48"/>
      <line x1="-60" y1="18" x2="-48" y2="18"/>
      <line x1="48" y1="18" x2="60" y2="18"/>
      <line x1="0" y1="0" x2="-48" y2="18"/>
      <line x1="0" y1="0" x2="48" y2="18"/>
      <line x1="0" y1="0" x2="0" y2="52"/>
      <line x1="0" y1="18" x2="-18" y2="34"/>
