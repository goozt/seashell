        L 60 -12
        L 60 18
        L 48 18
        L 48 32
        L 35 45
        L 18 34
        L 10 45
        L 0 52
        L -10 45
        L -18 34
        L -35 45
        L -48 32
        L -48 18
        L -60 18
        L -60 -12
        L -42 -48
        Z
      "/>
    </clipPath>

    <polygon points="0,0 -42,-48 -60,-12 -60,18 -48,18" fill="url(#wm-ll)" clip-path="url(#shell-clip-wm)"/>
    <polygon points="0,0 -25,-62 -42,-48" fill="url(#wm-lm)" clip-path="url(#shell-clip-wm)"/>
    <polygon points="0,0 0,-68 -25,-62" fill="url(#wm-cl)" clip-path="url(#shell-clip-wm)"/>
    <polygon points="0,0 25,-62 0,-68" fill="url(#wm-cr)" clip-path="url(#shell-clip-wm)"/>
    <polygon points="0,0 42,-48 25,-62" fill="url(#wm-rm)" clip-path="url(#shell-clip-wm)"/>
    <polygon points="0,0 60,-12 60,18 48,18 42,-48" fill="url(#wm-rr)" clip-path="url(#shell-clip-wm)"/>
    <polygon points="0,0 -48,18 -48,32 -35,45 -18,34 -10,45 0,52 0,18" fill="url(#wm-bl)" clip-path="url(#shell-clip-wm)"/>
